<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Customer File (R&amp;D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1f4e8c; --bg: #f5f6f8; --surface: #fff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
      --danger: #a61b1b; --warn-bg: #fff8e1; --warn: #b45309;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: 'Kantumruy Pro', system-ui, 'Segoe UI', sans-serif; font-size: 14px; color: var(--text); background: var(--bg); }
    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.danger { color: var(--danger); border-color: #f1c4c4; }
    button.delete { background: var(--danger); border-color: var(--danger); color: #fff; }
    input { font: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; }
    .hidden { display: none !important; }
    header { background: var(--primary); color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    header button { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
    .card { max-width: 340px; margin: 80px auto; background: var(--surface); padding: 24px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card h2 { margin: 0 0 16px; font-size: 18px; }
    .card label { display: block; margin: 10px 0 4px; color: var(--muted); }
    .card button { width: 100%; margin-top: 16px; }
    .error { color: var(--danger); margin-top: 10px; min-height: 20px; }
    #viewer { max-width: 960px; margin: 16px auto; padding: 0 16px; }
    .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .bar .meta { flex: 1; color: var(--muted); overflow-wrap: anywhere; }
    .note { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
    #content { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
    #content img { max-width: 100%; height: auto; }
    #content iframe { width: 100%; height: 75vh; border: 0; }
    #status { color: var(--muted); padding: 24px; }
    .dialog-backdrop { position: fixed; inset: 0; background: rgba(17, 24, 39, .45); display: grid; place-items: center; z-index: 10; }
    .dialog { background: var(--surface); border-radius: 12px; padding: 20px 22px; width: min(380px, calc(100vw - 32px)); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    .dialog h3 { margin: 0 0 6px; font-size: 16px; overflow-wrap: anywhere; }
    .dialog p { margin: 0 0 18px; color: var(--muted); }
    .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Customer file <small style="opacity:.7;font-weight:400">R&amp;D</small></h1>
    <button id="logout" class="hidden" type="button">Sign out</button>
  </header>

  <form id="login" class="card hidden" autocomplete="on">
    <h2>Agent sign in</h2>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button class="primary" type="submit">Sign in and open the file</button>
    <div class="error" id="login-error"></div>
  </form>

  <main id="viewer" class="hidden">
    <div class="bar">
      <div class="meta" id="meta"></div>
      <button id="delete" class="danger hidden" type="button">Delete file</button>
    </div>
    <div class="note">Personal data: view only what you need, do not download or forward it. Every view and delete is recorded.</div>
    <div id="content"><div id="status">Opening…</div></div>
  </main>

  <div id="confirm" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="dialog">
      <h3 id="confirm-title">Delete this file?</h3>
      <p>The file is erased for good. The customer will see that you removed it.</p>
      <div class="actions">
        <button id="confirm-cancel" type="button">Cancel</button>
        <button id="confirm-ok" type="button" class="delete">Delete</button>
      </div>
    </div>
  </div>

<script>
// Opened from the link that Botpress Desk mode posts to the agent: /agent/file.html?f=<handover id>.<file id>.
// One parameter, no "&": Desk shows an "&" in a link as "&amp;", which broke the older two-parameter links.
// The file never goes to Botpress; this page fetches it with the agent login, and the backend audits each view.
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const [handoverId, fileId] = params.has('f')
    ? params.get('f').split('.')
    // links posted before: ?handover=<id>&file=<id>, as Desk turned them into ?handover=<id>&amp;file=<id>
    : [params.get('handover'), params.get('file') || params.get('amp;file')];
  const url = `/api/v1/agent/handovers/${encodeURIComponent(handoverId || '')}/attachments/${encodeURIComponent(fileId || '')}`;
  let auth = null;
  let objectUrl = null;

  function showLogin(message) {
    auth = null;
    try { sessionStorage.removeItem('agent-auth'); } catch { /* ignore */ }
    $('viewer').classList.add('hidden');
    $('logout').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('login-error').textContent = message || '';
  }

  function showStatus(text) {
    $('content').replaceChildren(Object.assign(document.createElement('div'), { id: 'status', textContent: text }));
  }

  function fileSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }

  async function open() {
    $('login').classList.add('hidden');
    $('viewer').classList.remove('hidden');
    $('logout').classList.remove('hidden');
    $('delete').classList.add('hidden');
    showStatus('Opening…');
    let res;
    try {
      res = await fetch(url, { headers: { Authorization: auth }, cache: 'no-store' });
    } catch (err) {
      showStatus('Cannot reach the server: ' + err.message);
      return;
    }
    if (res.status === 401) { showLogin('Wrong username or password.'); return; }
    if (res.status === 404) { $('meta').textContent = ''; showStatus('File removed: it was deleted by an agent or after the retention period.'); return; }
    if (!res.ok) { showStatus('Could not open the file (HTTP ' + res.status + ').'); return; }
    try { sessionStorage.setItem('agent-auth', auth); } catch { /* ignore */ }

    const blob = await res.blob();
    const type = res.headers.get('Content-Type') || blob.type;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(blob);
    const name = (res.headers.get('Content-Disposition') || '').match(/filename\*=UTF-8''([^;]+)/i);
    $('meta').textContent = `${name ? decodeURIComponent(name[1]) : 'File'} · ${type.startsWith('image/') ? 'image' : 'PDF'} · ${fileSize(blob.size)}`;
    const view = type.startsWith('image/')
      ? Object.assign(document.createElement('img'), { src: objectUrl, alt: 'File sent by the customer' })
      : Object.assign(document.createElement('iframe'), { src: objectUrl, title: 'File sent by the customer' });
    $('content').replaceChildren(view);
    $('delete').classList.remove('hidden');
  }

  function confirmDelete() {
    return new Promise((resolve) => {
      const box = $('confirm');
      box.classList.remove('hidden');
      $('confirm-cancel').focus();
      const done = (answer) => {
        box.classList.add('hidden');
        $('confirm-ok').onclick = $('confirm-cancel').onclick = box.onclick = document.onkeydown = null;
        resolve(answer);
      };
      $('confirm-ok').onclick = () => done(true);
      $('confirm-cancel').onclick = () => done(false);
      box.onclick = (e) => { if (e.target === box) done(false); };
      document.onkeydown = (e) => { if (e.key === 'Escape') done(false); };
    });
  }

  $('delete').addEventListener('click', async () => {
    if (!(await confirmDelete())) return;
    const res = await fetch(url, { method: 'DELETE', headers: { Authorization: auth } }).catch(() => null);
    if (res && res.status === 401) { showLogin('Your session expired. Please sign in again.'); return; }
    if (!res || (!res.ok && res.status !== 404)) { alert('Could not delete the file.'); return; }
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    $('delete').classList.add('hidden');
    showStatus('File deleted. The customer sees that you removed it.');
  });

  $('login').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = $('username').value.trim();
    auth = 'Basic ' + btoa(unescape(encodeURIComponent(user + ':' + $('password').value)));
    $('password').value = '';
    open();
  });

  $('logout').addEventListener('click', () => {
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    showLogin('');
  });

  if (!handoverId || !fileId) {
    $('viewer').classList.remove('hidden');
    showStatus('This link is incomplete.');
    return;
  }
  try { auth = sessionStorage.getItem('agent-auth'); } catch { /* ignore */ }
  if (auth) open(); else showLogin('');
})();
</script>
</body>
</html>
