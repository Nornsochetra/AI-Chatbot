<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Customer Message (R&amp;D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1f4e8c; --bg: #f5f6f8; --surface: #fff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
      --danger: #a61b1b; --warn-bg: #fff8e1; --warn: #b45309;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: 'Kantumruy Pro', system-ui, 'Segoe UI', sans-serif; font-size: 14px; color: var(--text); background: var(--bg); }
    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    input { font: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; }
    .hidden { display: none !important; }
    header { background: var(--primary); color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    header button { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
    .card { max-width: 340px; margin: 80px auto; background: var(--surface); padding: 24px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card h2 { margin: 0 0 16px; font-size: 18px; }
    .card label { display: block; margin: 10px 0 4px; color: var(--muted); }
    .card button { width: 100%; margin-top: 16px; }
    .error { color: var(--danger); margin-top: 10px; min-height: 20px; }
    #viewer { max-width: 720px; margin: 16px auto; padding: 0 16px; }
    .meta { color: var(--muted); margin-bottom: 12px; }
    .note { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
    #content { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
    #text { font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    #status { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Customer message <small style="opacity:.7;font-weight:400">R&amp;D</small></h1>
    <button id="logout" class="hidden" type="button">Sign out</button>
  </header>

  <form id="login" class="card hidden" autocomplete="on">
    <h2>Agent sign in</h2>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button class="primary" type="submit">Sign in and open the message</button>
    <div class="error" id="login-error"></div>
  </form>

  <main id="viewer" class="hidden">
    <div class="meta" id="meta"></div>
    <div class="note">Personal data the AI does not get: use it only for this customer's request, do not copy or forward it. Every view is recorded. OTP, PIN, CVV and passwords stay hidden.</div>
    <div id="content"><div id="status">Opening…</div></div>
  </main>

<script>
// Opened from the link Botpress Desk mode posts when masking hid personal data from Botpress:
// /agent/message.html?m=<handover id>.<message id> (one parameter: Desk shows "&" in links as "&amp;").
// The same agent login as the file page; the backend audits each view.
(() => {
  const $ = (id) => document.getElementById(id);
  const [handoverId, messageId] = (new URLSearchParams(location.search).get('m') || '').split('.');
  const url = `/api/v1/agent/handovers/${encodeURIComponent(handoverId || '')}/messages/${encodeURIComponent(messageId || '')}`;
  let auth = null;

  function showLogin(message) {
    auth = null;
    try { sessionStorage.removeItem('agent-auth'); } catch { /* ignore */ }
    $('viewer').classList.add('hidden');
    $('logout').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('login-error').textContent = message || '';
  }

  function showStatus(text) {
    $('content').replaceChildren(Object.assign(document.createElement('div'), { id: 'status', textContent: text }));
  }

  async function open() {
    $('login').classList.add('hidden');
    $('viewer').classList.remove('hidden');
    $('logout').classList.remove('hidden');
    $('meta').textContent = '';
    showStatus('Opening…');
    let res;
    try {
      res = await fetch(url, { headers: { Authorization: auth }, cache: 'no-store' });
    } catch (err) {
      showStatus('Cannot reach the server: ' + err.message);
      return;
    }
    if (res.status === 401) { showLogin('Wrong username or password.'); return; }
    if (res.status === 404) { showStatus('Message no longer available: it was deleted after the retention period.'); return; }
    if (!res.ok) { showStatus('Could not open the message (HTTP ' + res.status + ').'); return; }
    try { sessionStorage.setItem('agent-auth', auth); } catch { /* ignore */ }

    const message = await res.json();
    $('meta').textContent = 'Sent by the customer · ' + new Date(message.sentAt).toLocaleString();
    // plain text only, never HTML
    $('content').replaceChildren(Object.assign(document.createElement('div'), { id: 'text', textContent: message.text }));
  }

  $('login').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = $('username').value.trim();
    auth = 'Basic ' + btoa(unescape(encodeURIComponent(user + ':' + $('password').value)));
    $('password').value = '';
    open();
  });

  $('logout').addEventListener('click', () => showLogin(''));

  if (!handoverId || !messageId) {
    $('viewer').classList.remove('hidden');
    showStatus('This link is incomplete.');
    return;
  }
  try { auth = sessionStorage.getItem('agent-auth'); } catch { /* ignore */ }
  if (auth) open(); else showLogin('');
})();
</script>
</body>
</html>
